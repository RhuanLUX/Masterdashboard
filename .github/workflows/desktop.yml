name: Desktop installers
on:
  workflow_dispatch:
jobs:
  package:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-15-intel
            arch: x64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: node tests/platform-core.cjs
      - run: node tests/desktop-smoke.cjs
        timeout-minutes: 4
      - run: node tests/desktop-import.cjs
        timeout-minutes: 5
      - if: runner.os == 'Windows'
        run: pnpm dist:win
      - if: runner.os == 'macOS'
        run: pnpm exec electron-builder --mac dmg --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node tools/test-packaged.cjs
        timeout-minutes: 6
      - uses: actions/upload-artifact@v4
        with:
          name: RPG-Master-${{ runner.os }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            docs/qa-platform-v4/desktop-*.png
            docs/qa-platform-v4/desktop-report.json
            docs/qa-platform-v4/desktop-import-report.json
          retention-days: 14
