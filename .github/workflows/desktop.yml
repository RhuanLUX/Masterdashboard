name: Desktop installers
on:
  workflow_dispatch:
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: node tests/platform-core.cjs
      - run: node tests/desktop-smoke.cjs
      - run: node tests/desktop-import.cjs
      - if: runner.os == 'Windows'
        run: pnpm dist:win
      - if: runner.os == 'macOS'
        run: pnpm dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node tools/test-packaged.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: RPG-Master-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            docs/qa-platform-v4/desktop-*.png
            docs/qa-platform-v4/desktop-report.json
            docs/qa-platform-v4/desktop-import-report.json
          retention-days: 14
