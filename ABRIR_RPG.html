<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>RPG Master</title><body style="background:#081523;color:#ead5a5;font:20px Georgia;padding:8vh 10vw"><h1>RPG Master</h1><p>No aplicativo instalado, use o atalho RPG Master.</p><p>Na pasta do projeto, execute somente <strong>INICIAR_RPG.bat</strong> (Windows) ou <strong>INICIAR_RPG.command</strong> (macOS). Ele inicia o servidor e abre a campanha.</p><p><a style="color:#ead5a5" href="http://127.0.0.1:41731/">Abrir servidor local já iniciado</a></p></body></html>
